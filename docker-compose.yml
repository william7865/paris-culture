services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: paris
      POSTGRES_PASSWORD: paris
      POSTGRES_DB: parisculture
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paris -d parisculture"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      ALLOWED_ORIGIN: http://localhost:3000
      CACHE_TTL_MS: 300000
      DATABASE_URL: postgresql://paris:paris@db:5432/parisculture
      JWT_SECRET: change_this_in_production
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
